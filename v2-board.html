</div></main>
<script>
const H={"Content-Type":"application/json","X-VLFC-Request":"v2"},q=new URLSearchParams(location.search),boardId=q.get("board"),share=q.get("share"),scenarioShare=q.get("scenario"),viewer=!!share||!!scenarioShare;
if(viewer)document.body.classList.add("viewer");
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg",svg=$("board"),pitch=$("pitchLayer"),pieces=$("piecesLayer"),ghosts=$("ghostLayer"),actionsLayer=$("actionsLayer");
let orientation="horizontal",stateVersion=0,teamId=null,selected=null,dragging=null,pointerId=null,lastAnalysis=null,sendTimer=null,activeTool="select",actionStart=null,actions=[],frames=[],currentFrameIndex=0,animationToken=0,isPlaying=false,playTimer=null,framesLoaded=false;const ps=new Map();const ball={id:"ball",type:"ball",x:600,y:350,el:null};
function S(t,a={}){const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
async function api(path,opt={}){const r=await fetch(path,{credentials:"same-origin",...opt,headers:{...H,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
function draw(){
 pitch.innerHTML="";

 if(orientation==="horizontal"){
  svg.setAttribute("viewBox","0 0 1200 700");

  pitch.append(
   S("rect",{x:10,y:10,width:1180,height:680,rx:18,fill:"url(#grassH)"}),

   S("rect",{x:25,y:25,width:1150,height:650,fill:"none",stroke:"white","stroke-width":4}),

   S("line",{x1:600,y1:25,x2:600,y2:675,stroke:"white","stroke-width":4}),

   S("circle",{cx:600,cy:350,r:85,fill:"none",stroke:"white","stroke-width":4}),

   S("circle",{cx:600,cy:350,r:5,fill:"white"}),

   /* Left penalty / goal area */
   S("rect",{x:25,y:190,width:180,height:320,fill:"none",stroke:"white","stroke-width":4}),

   /* Right penalty / goal area */
   S("rect",{x:995,y:190,width:180,height:320,fill:"none",stroke:"white","stroke-width":4}),

   /* Left goal */
   S("rect",{x:5,y:270,width:20,height:160,fill:"none",stroke:"white","stroke-width":4}),

  );

 }else{

  pitch.append(
   S("rect",{x:10,y:10,width:680,height:980,rx:18,fill:"url(#grassV)"}),

   S("rect",{x:25,y:25,width:650,height:950,fill:"none",stroke:"white","stroke-width":4}),

   S("line",{x1:25,y1:500,x2:675,y2:500,stroke:"white","stroke-width":4}),

   S("circle",{cx:350,cy:500,r:85,fill:"none",stroke:"white","stroke-width":4}),

   S("circle",{cx:350,cy:500,r:5,fill:"white"}),

   /* Top penalty / goal area */
   S("rect",{x:180,y:25,width:340,height:150,fill:"none",stroke:"white","stroke-width":4}),

   /* Bottom penalty / goal area */
   S("rect",{x:180,y:825,width:340,height:150,fill:"none",stroke:"white","stroke-width":4}),

   /* Top goal */
   S("rect",{x:270,y:5,width:160,height:20,fill:"none",stroke:"white","stroke-width":4}),

}
const SHIRT_PATH="M-12,-30 L-30,-24 L-38,-6 L-28,-2 L-26,28 L26,28 L28,-2 L38,-6 L30,-24 L12,-30 Q0,-20 -12,-30 Z";
function polyPoints(cx,cy,r,rot){return Array.from({length:5},(_,i)=>{const a=(rot+72*i)*Math.PI/180;return (cx+r*Math.cos(a)).toFixed(2)+","+(cy+r*Math.sin(a)).toFixed(2)}).join(" ")}
function ballPattern(){const parts=[S("polygon",{points:polyPoints(0,0,8,-90),fill:"#111827"})];for(let i=0;i<5;i++){const a=(-54+72*i)*Math.PI/180;parts.push(S("polygon",{points:polyPoints(16*Math.cos(a),16*Math.sin(a),5,-54+72*i),fill:"#111827"}))}return parts}
function createBall(){const g=S("g");g.dataset.id="ball";g.append(S("circle",{r:22,fill:"transparent"}));const body=S("g",{filter:"url(#shadow)"});body.append(S("circle",{r:22,fill:"white",stroke:"#111827","stroke-width":2}),...ballPattern());g.append(body);pieces.append(g);ball.el=g;update(ball)}
function nextId(team){let i=1;while(ps.has(team+i))i++;return team+i}
function createPlayer(team,id,data={}){id=id||nextId(team);if(ps.has(id))return ps.get(id);const g=S("g");g.dataset.id=id;g.append(S("circle",{r:36,fill:"transparent"}));const shirt=S("g",{filter:"url(#shadow)"});shirt.append(S("path",{d:SHIRT_PATH,fill:team==="A"?"url(#shirtA)":"url(#shirtB)",stroke:"white","stroke-width":3,"stroke-linejoin":"round"}));g.append(shirt);const t=S("text",{"text-anchor":"middle",fill:"white","font-size":17,"font-weight":800,"pointer-events":"none",stroke:"#0f172a","stroke-width":4,"paint-order":"stroke"});g.append(t);pieces.append(g);const p={id,team,type:"player",x:data.x||600,y:data.y||350,name:data.name||id,role:data.role||"",specs:data.specs||"",team_player_id:data.team_player_id||null,el:g,text:t};ps.set(id,p);label(p);update(p);return p}
function label(p){p.text.textContent=p.name||p.id;p.text.setAttribute("y","50")}
function update(p){p.el.setAttribute("transform",`translate(${p.x} ${p.y})`)}
function point(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;const z=p.matrixTransform(svg.getScreenCTM().inverse());return{x:z.x,y:z.y}}
function clamp(p,x,y){const r=p.type==="ball"?22:36;if(orientation==="horizontal")return{x:Math.max(25+r,Math.min(1175-r,x)),y:Math.max(25+r,Math.min(675-r,y))};return{x:Math.max(25+r,Math.min(675-r,x)),y:Math.max(25+r,Math.min(975-r,y))}}
function get(id){return id==="ball"?ball:ps.get(id)}
svg.onpointerdown=e=>{if(viewer)return;if(activeTool!=="select"){actionStart=point(e.clientX,e.clientY);return}const g=e.target.closest("[data-id]");if(!g)return;dragging=get(g.dataset.id);pointerId=e.pointerId;dragging.el.setPointerCapture(pointerId);if(dragging.type==="player")select(dragging.id)}
svg.onpointermove=e=>{if(activeTool!=="select")return;if(!dragging||e.pointerId!==pointerId)return;const q=point(e.clientX,e.clientY),z=clamp(dragging,q.x,q.y);dragging.x=z.x;dragging.y=z.y;update(dragging);queueSave()}
svg.onpointerup=e=>{if(viewer)return;if(activeTool!=="select"){if(!actionStart)return;const end=point(e.clientX,e.clientY);if(Math.hypot(end.x-actionStart.x,end.y-actionStart.y)>15){actions.push({id:"act_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),type:activeTool,x1:actionStart.x,y1:actionStart.y,x2:end.x,y2:end.y,step:actions.length+1,label:""});renderActions();saveState()}actionStart=null;return}if(!dragging||e.pointerId!==pointerId)return;dragging=null;pointerId=null;saveState()}
function select(id){
 selected=id;
 const p=ps.get(id);
 if(!p)return;

 $("editor").classList.remove("hidden");
 $("name").value=p.name||p.id;
 $("role").value=p.role||"";
 $("specs").value=p.specs||"";
}

$("save").onclick=async()=>{
 if(!selected)return;

 const p=ps.get(selected);
 if(!p)return;

 p.name=$("name").value.trim()||p.id;
 p.role=$("role").value.trim();
 p.specs=$("specs").value.trim();

 label(p);

 try{
  await saveState();
  $("status").textContent="Player updated • state "+stateVersion;
 }catch(e){
  $("status").textContent="Player save failed: "+e.message;

};

$("del").onclick=async()=>{
 const p=ps.get(selected);

 if(p){
  p.el.remove();
  ps.delete(selected);
 }

 $("editor").classList.add("hidden");

 try{
  await saveState();

function toolStyle(type){if(type==="shot")return{stroke:"#ef4444",dash:"",marker:"url(#arrowShot)",width:5};if(type==="run")return{stroke:"#facc15",dash:"12 8",marker:"url(#arrowRun)",width:4};if(type==="dribble")return{stroke:"#60a5fa",dash:"4 7",marker:"url(#arrowPass)",width:4};if(type==="press")return{stroke:"#fb923c",dash:"8 5",marker:"url(#arrowPress)",width:4};return{stroke:"#ffffff",dash:"",marker:"url(#arrowPass)",width:4}}
function renderActions(){actionsLayer.innerHTML="";actions.forEach((a,i)=>{const s=toolStyle(a.type),line=S("line",{x1:a.x1,y1:a.y1,x2:a.x2,y2:a.y2,stroke:s.stroke,"stroke-width":s.width,"stroke-dasharray":s.dash,"marker-end":s.marker,"stroke-linecap":"round"});actionsLayer.append(line);const mx=(Number(a.x1)+Number(a.x2))/2,my=(Number(a.y1)+Number(a.y2))/2;actionsLayer.append(S("circle",{cx:mx,cy:my,r:12,fill:"#111827",stroke:s.stroke,"stroke-width":2}));const t=S("text",{x:mx,y:my+4,"text-anchor":"middle",fill:"#fff","font-size":11,"font-weight":800});t.textContent=String(a.step||i+1);actionsLayer.append(t)})}
function setTool(t){activeTool=t;actionStart=null;document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("active",b.dataset.tool===t))}document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>setTool(b.dataset.tool));setTool("select");$("undoActionBtn").onclick=()=>{if(actions.length){actions.pop();renderActions();saveState()}};$("clearActionsBtn").onclick=()=>{actions=[];renderActions();saveState()};
function currentPositionsSnapshot(){

 ps.forEach((p,id)=>{pos[id]={x:p.x,y:p.y}});
 return pos;
}

function captureFrameObject(name="Frame",duration=1800){
 return{
  id:"frame_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),
  name,
  duration_ms:Number(duration)||1800,
  positions:currentPositionsSnapshot(),
  actions:actions.map(a=>({...a}))

}

function applyFrame(frame,animate=false){
 if(!frame)return;

 actions=(frame.actions||[]).map(a=>({...a}));
 renderActions();

 const target=frame.positions||{};

 if(!animate){
  for(const[id,to]of Object.entries(target)){
   const obj=get(id);
   if(!obj)continue;
   obj.x=Number(to.x);obj.y=Number(to.y);update(obj);
  }
  return;
 }

 const duration=Math.max(200,Math.min(Number(frame.duration_ms)||1800,5000));
 const starts={};
 for(const[id,to]of Object.entries(target)){
  const obj=get(id);
  if(obj)starts[id]={x:obj.x,y:obj.y};
 }

 const token=++animationToken;
 const started=performance.now();

 function tick(ts){
  if(token!==animationToken)return;
  const t=Math.min(1,(ts-started)/duration);
  const eased=1-Math.pow(1-t,3);

  for(const[id,to]of Object.entries(target)){
   const obj=get(id),from=starts[id];
   if(!obj||!from)continue;
   obj.x=from.x+(Number(to.x)-from.x)*eased;
   obj.y=from.y+(Number(to.y)-from.y)*eased;
   update(obj);
  }

  if(t<1)requestAnimationFrame(tick);
 }
 requestAnimationFrame(tick);
}

function renderFrameUi(){
 if(!frames.length)frames=[captureFrameObject("Frame 1",1800)];
 currentFrameIndex=Math.max(0,Math.min(currentFrameIndex,frames.length-1));
 const f=frames[currentFrameIndex];

 $("frameIndicator").textContent=`Frame ${currentFrameIndex+1} / ${frames.length} — ${f.name}`;
 $("frameName").value=f.name||("Frame "+(currentFrameIndex+1));
 $("frameDuration").value=String(f.duration_ms||1800);

 $("frameStrip").innerHTML=frames.map((fr,i)=>
  `<button class="frame-chip ${i===currentFrameIndex?"active":""}" data-frame="${i}">${i+1}. ${esc(fr.name)}</button>`
 ).join("");

 $("frameStrip").querySelectorAll("[data-frame]").forEach(b=>{
  b.onclick=()=>{
   stopPlayback();
   currentFrameIndex=Number(b.dataset.frame);
   applyFrame(frames[currentFrameIndex],false);
   renderFrameUi();
  };
 });
}

function saveCurrentFrame(){
 if(!frames.length)frames=[captureFrameObject("Frame 1",1800)];
 const old=frames[currentFrameIndex];

 frames[currentFrameIndex]={
  id:old?.id||("frame_"+Date.now()),
  name:$("frameName").value.trim()||("Frame "+(currentFrameIndex+1)),
  duration_ms:Number($("frameDuration").value)||1800,
  positions:currentPositionsSnapshot(),
  actions:actions.map(a=>({...a}))
 };

 renderFrameUi();
 saveState();
}

function addFrame(duplicate=false){
 stopPlayback();

 let f;
 if(duplicate&&frames[currentFrameIndex]){
  f=JSON.parse(JSON.stringify(frames[currentFrameIndex]));
  f.name=(f.name||"Frame")+" copy";
 }else{
  f=captureFrameObject("Frame "+(frames.length+1),1800);
 }

 f.id="frame_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
 frames.splice(currentFrameIndex+1,0,f);
 currentFrameIndex++;

 applyFrame(f,false);
 renderFrameUi();
 saveState();
}

function deleteFrame(){
 stopPlayback();

 if(frames.length<=1){
  frames=[captureFrameObject("Frame 1",1800)];
  currentFrameIndex=0;
 }else{
  frames.splice(currentFrameIndex,1);
  currentFrameIndex=Math.max(0,currentFrameIndex-1);
 }

 applyFrame(frames[currentFrameIndex],false);
 renderFrameUi();
 saveState();
}

function goFrame(delta){
 stopPlayback();
 currentFrameIndex=Math.max(0,Math.min(frames.length-1,currentFrameIndex+delta));
 applyFrame(frames[currentFrameIndex],false);
 renderFrameUi();
}

function stopPlayback(){
 isPlaying=false;
 animationToken++;
 if(playTimer){clearTimeout(playTimer);playTimer=null}
}

function playFromCurrent(){
 if(!frames.length)return;

 stopPlayback();
 isPlaying=true;

 function runFrame(){
  if(!isPlaying)return;
  const f=frames[currentFrameIndex];

  applyFrame(f,true);
  renderFrameUi();

  const wait=Math.max(500,Number(f.duration_ms)||1800)+250;
  playTimer=setTimeout(()=>{
   if(!isPlaying)return;
   if(currentFrameIndex>=frames.length-1){
    stopPlayback();
    return;
   }
   currentFrameIndex++;
   runFrame();
  },wait);
 }

 runFrame();
}

$("prevFrameBtn").onclick=()=>goFrame(-1);
$("nextFrameBtn").onclick=()=>goFrame(1);
$("playBtn").onclick=playFromCurrent;
$("pauseBtn").onclick=stopPlayback;
$("addFrameBtn").onclick=()=>addFrame(false);
$("duplicateFrameBtn").onclick=()=>addFrame(true);
$("updateFrameBtn").onclick=saveCurrentFrame;
$("deleteFrameBtn").onclick=deleteFrame;

function state(){const pos={ball:{x:ball.x,y:ball.y}},players={};ps.forEach((p,id)=>{pos[id]={x:p.x,y:p.y};players[id]={name:p.name,role:p.role,specs:p.specs,team_player_id:p.team_player_id}});return{
 orientation,
 positions:pos,
 players,
 actions:actions.map(a=>({...a})),
 frames:frames.map(f=>({
  id:f.id,
  name:f.name,
  duration_ms:f.duration_ms,
  positions:JSON.parse(JSON.stringify(f.positions||{})),
  actions:(f.actions||[]).map(a=>({...a}))
 })),
 context:{velocity_team:"A",possession:"velocity",phase:"Build-up",game_state:"Drawing",scenario:"General analysis"}
}}
function loadState(s,restoreFrames=false){orientation=s.orientation||"horizontal";draw();const wanted=new Set(Object.keys(s.players||{}));[...ps.keys()].forEach(id=>{if(!wanted.has(id)){ps.get(id).el.remove();ps.delete(id)}});for(const[id,d]of Object.entries(s.players||{})){let p=ps.get(id)||createPlayer(id.startsWith("B")?"B":"A",id,d);Object.assign(p,d);const q=s.positions?.[id];if(q){p.x=Number(q.x);p.y=Number(q.y)}label(p);update(p)}const b=s.positions?.ball;if(b){ball.x=Number(b.x);ball.y=Number(b.y);update(ball)}actions=Array.isArray(s.actions)?s.actions.map(a=>({...a})):[];renderActions();if(restoreFrames){frames=(Array.isArray(s.frames)?s.frames:[]).map(f=>({...f,positions:{...(f.positions||{})},actions:(f.actions||[]).map(a=>({...a}))}));currentFrameIndex=0}stateVersion=s.version||0}
function queueSave(){clearTimeout(sendTimer);sendTimer=setTimeout(saveState,100)}
async function saveState(){
 if(viewer)return null;

 const payload=state();

 const d=await api(`/api/v2/boards/${boardId}/state`,{
  method:"PUT",
  body:JSON.stringify(payload)
 });

 stateVersion=d.version;
 $("status").textContent="Saved • state "+stateVersion;

 return d;
}
async function poll(){try{let d;if(scenarioShare)d=await api("/api/v2/scenario-share/"+scenarioShare);else if(share)d=await api("/api/v2/share/"+share);else d=await api("/api/v2/boards/"+boardId);title.textContent=scenarioShare?(d.name+" — "+(d.board_name||"Scenario")):d.name;teamId=d.team_id||teamId;if(!dragging){loadState(d.state,!framesLoaded);framesLoaded=true}if(!viewer)$("status").textContent="Live • state "+stateVersion}catch(e){$("status").textContent=e.message}}
function add(team,data={}){const p=createPlayer(team,null,data);p.x=orientation==="horizontal"?(team==="A"?430:770):350;p.y=orientation==="horizontal"?350:(team==="A"?650:350);update(p);saveState()}
document.querySelectorAll(".source").forEach(x=>x.onclick=()=>!viewer&&add(x.dataset.team))
hBtn.onclick=()=>{orientation="horizontal";draw();saveState()};vBtn.onclick=()=>{orientation="vertical";draw();saveState()}
async function loadSquad(){if(viewer||!teamId)return;const d=await api(`/api/v2/teams/${teamId}/players`);squad.innerHTML=d.players.map(p=>`<div class="source red" data-p='${encodeURIComponent(JSON.stringify(p))}'>${esc(p.name)}<div class="muted">${esc(p.role)}</div></div>`).join("");squad.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{const p=JSON.parse(decodeURIComponent(x.dataset.p));add("A",{name:p.name,role:p.role,specs:p.specs,team_player_id:p.id})})}
async function loadScenarios(){if(viewer||!boardId)return;try{const d=await api(`/api/v2/boards/${boardId}/scenarios`),list=d.scenarios||[];$("scenarioList").innerHTML=list.length?list.map(s=>`<div class="scenario-item"><b>${esc(s.name)}</b><div class="muted">${esc(s.description||"")}</div><div class="scenario-actions"><button data-load="${s.id}">Load</button><button data-update="${s.id}">Overwrite</button><a target="_blank" href="/v2-board.html?scenario=${encodeURIComponent(s.share_token)}">Share</a><button data-delete="${s.id}">Delete</button></div></div>`).join(""):'<div class="muted">No saved scenarios yet.</div>';$("scenarioList").querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>loadScenario(Number(b.dataset.load)));$("scenarioList").querySelectorAll("[data-update]").forEach(b=>b.onclick=()=>overwriteScenario(Number(b.dataset.update)));$("scenarioList").querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteScenario(Number(b.dataset.delete)))}catch(e){$("scenarioList").textContent="Scenario error: "+e.message}}
$("saveScenarioBtn").onclick=async()=>{const n=$("scenarioName").value.trim();if(!n){$("scenarioList").textContent="Enter a scenario name first.";return}try{await saveState();await api(`/api/v2/boards/${boardId}/scenarios`,{method:"POST",body:JSON.stringify({name:n,description:$("scenarioDescription").value.trim(),state:state()})});$("scenarioName").value="";$("scenarioDescription").value="";loadScenarios()}catch(e){$("scenarioList").textContent=e.message}};
async function loadScenario(id){const d=await api(`/api/v2/scenarios/${id}`);stopPlayback();loadState(d.state,true);renderFrameUi();await saveState();$("status").textContent="Loaded scenario: "+d.name}async function overwriteScenario(id){await api(`/api/v2/scenarios/${id}`,{method:"PUT",body:JSON.stringify({state:state()})});$("status").textContent="Scenario overwritten";loadScenarios()}async function deleteScenario(id){if(!confirm("Delete this saved scenario?"))return;await api(`/api/v2/scenarios/${id}`,{method:"DELETE",body:"{}"});loadScenarios()}
analyseBtn.onclick=async()=>{try{aiResult.textContent="Analysing…";const d=await api(`/api/v2/boards/${boardId}/analyse`,{method:"POST",body:"{}"});lastAnalysis=d.analysis;renderAi(d.analysis);ghostAi(d.analysis.recommendations||[])}catch(e){aiResult.textContent=e.message}}
function renderAi(a){aiResult.innerHTML=`<div class="summary"><b>${esc(a.summary||"Analysis")}</b></div>`+(a.recommendations||[]).map(r=>`<div class="rec"><b>${esc(ps.get(r.player_id)?.name||r.player_id)}</b>: ${esc(r.reason)}</div>`).join("");applyBtn.disabled=!(a.recommendations||[]).some(valid)}
function valid(r){return ps.has(r.player_id)&&Number.isFinite(Number(r.suggested_x))&&Number.isFinite(Number(r.suggested_y))}
function ghostAi(rs){ghosts.innerHTML="";rs.filter(valid).forEach(r=>{const g=S("g",{transform:`translate(${r.suggested_x} ${r.suggested_y})`});g.append(S("circle",{r:39,fill:"none",stroke:"#facc15","stroke-width":4,"stroke-dasharray":"8 6"}));ghosts.append(g)})}
applyBtn.onclick=()=>{(lastAnalysis?.recommendations||[]).filter(valid).forEach(r=>{const p=ps.get(r.player_id),z=clamp(p,Number(r.suggested_x),Number(r.suggested_y));p.x=z.x;p.y=z.y;update(p)});ghosts.innerHTML="";applyBtn.disabled=true;saveState()}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
(async()=>{
  draw();
  createBall();

  if(!boardId && !share && !scenarioShare){
    $("status").textContent="Missing board/share ID";
    return;
  }

  // PUBLIC VIEWER MODE:
  // share-token boards never require login.
  if(viewer){
    document.body.classList.add("viewer");
    try{await poll();if(!scenarioShare)setInterval(poll,500)}catch(e){$("status").textContent=e.message}
    return;
  }

  // COACH / EDIT MODE:
  // verify session before attempting to load the private board.
  try{
    const me=await api("/api/v2/me");
    if(!me.user){
      location.href="/v2.html?next="+encodeURIComponent(location.pathname+location.search);
      return;
    }
  }catch(e){
    location.href="/v2.html?next="+encodeURIComponent(location.pathname+location.search);
    return;
  }

  try{
    await poll();
    await loadSquad();
    await loadScenarios();
    renderFrameUi();
    setInterval(poll,500);
  }catch(e){
    $("status").textContent=e.message;
  }
})()
</script></body></html>
